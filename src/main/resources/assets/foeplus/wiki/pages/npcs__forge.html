<p>
The Forge NPC can be found directly East of spawn. This NPC allows the player to upgrade <a class="wikilink1" data-wiki-id="armor" href="/doku.php?id=armor#forge" title="armor">armor</a> &amp; <a class="wikilink1" data-wiki-id="armor" href="/doku.php?id=armor#supercharge" title="armor">lightning in a bottle</a> pieces to the next tier using shards.
Players ranked <img alt="" class="media" loading="lazy" src="/lib/exe/fetch.php?w=78&amp;tok=5283d5&amp;media=prefix_sailor.png" width="78"/> <a class="wikilink1" data-wiki-id="ranks" href="/doku.php?id=ranks" title="ranks">rank</a> or higher can use the command <span style="color:#daf7a6;">/forge</span> to access the NPC remotely
</p>
