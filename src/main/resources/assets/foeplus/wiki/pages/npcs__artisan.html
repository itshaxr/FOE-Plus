When having the <img alt="" class="media" loading="lazy" src="/lib/exe/fetch.php?w=78&amp;tok=87d133&amp;media=prefix_angler.png" width="78"/> <a class="wikilink1" data-wiki-id="ranks" href="/doku.php?id=ranks" title="ranks">rank</a> or above, you have permission to use <span style="color:#daf7a6;">/artisan</span> to access it remotely.
</p>
<p>
<a class="wikilink1" data-wiki-id="rodparts" href="/doku.php?id=rodparts" title="rodparts">Rod Parts</a> are unlocked by leveling up <a class="wikilink1" data-wiki-id="collections" href="/doku.php?id=collections" title="collections">collections</a>
