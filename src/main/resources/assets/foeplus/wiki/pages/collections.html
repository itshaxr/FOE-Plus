<h1 class="sectionedit1" id="collections">Collections</h1>
<div class="level1">
<hr/>
<p>
Collections are fishing related milestones that provide rewards, including money, power, items, and recipe unlocks. There are two types of collections, <a class="wikilink1" data-wiki-id="fish_collections" href="/doku.php?id=fish_collections" title="fish_collections">Fish Collections</a> and <a class="wikilink1" data-wiki-id="species_collections" href="/doku.php?id=species_collections" title="species_collections">Species Collections</a>. 
</p>
<p>
To access collections, perform /collections or navigate through the fishing menu. 
</p>
