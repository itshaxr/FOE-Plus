<h1 class="sectionedit1" id="identifier">Identifier</h1>
<div class="level1">
<hr/>
<div class="infobox" style="border: 1px solid #aaa; background-color: #333; color: #eee; width: 300px; float: right; margin: 0 0 1em 1em; padding: 0.5em; font-size: 95%; line-height: 1.5em;"><div class="infobox-title" style="font-size: 120%; font-weight: bold; margin-bottom: 0.5em; color: #fff;">
<p>
The Identifier
</p>
</div><div class="infobox-image" style="text-align: center; margin-bottom: 0.5em;"><img alt="The Identifier" src="/lib/exe/fetch.php?media=location:identifier.png" style="max-width: 100%; height: auto;"/></div><table class="infobox-table" style="width: 100%; border-spacing: 0;"></table></div>
<p>
The identifier NPC is located directly East of spawn. Unidentified <a class="wikilink1" data-wiki-id="armor" href="/doku.php?id=armor" title="armor">armor pieces</a> can be brought to this <a class="wikilink1" data-wiki-id="npcs" href="/doku.php?id=npcs" title="npcs">NPC</a> to get them <a class="wikilink1" data-wiki-id="armor" href="/doku.php?id=armor" title="armor">identified</a>.
</p>
<p>
This NPC can be accessed remotely by players <a class="wikilink1" data-wiki-id="ranks" href="/doku.php?id=ranks" title="ranks">ranked</a> <img alt="" class="media" loading="lazy" src="/lib/exe/fetch.php?w=78&amp;tok=5283d5&amp;media=prefix_sailor.png" width="78"/> or higher using the command <span style="color:#daf7a6;">/identifier</span>.
</p>
</div>
